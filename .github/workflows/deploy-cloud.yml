name: Deploy to cloud.amux.io

on:
  push:
    branches: [main]
    paths:
      - 'amux-server.py'
      - 'cloud/gateway/gateway.py'
      - 'cloud/docker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H 34.121.177.76 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy amux-server.py (shared mount for all containers)
        run: |
          # --inplace: overwrite in place to preserve inode (Docker bind mounts track inode, not path)
          rsync --inplace -e "ssh -i ~/.ssh/amux_cloud" amux-server.py \
            root@34.121.177.76:/opt/amux-cloud/app/amux-server.py
          # Touch to trigger auto-restart in all running containers
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 \
            'touch /opt/amux-cloud/app/amux-server.py && echo "amux-server.py deployed"'

      - name: Ensure admin emails configured (idempotent)
        run: |
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 '
            grep -q "^ADMIN_EMAILS=" /etc/amux/gateway.env || echo "ADMIN_EMAILS=ethan@mixpeek.com,esteininger21@gmail.com" >> /etc/amux/gateway.env
            grep "^ADMIN_EMAILS=" /etc/amux/gateway.env | grep -q "hello@amux.io" || sed -i "s/^ADMIN_EMAILS=/ADMIN_EMAILS=hello@amux.io,/" /etc/amux/gateway.env
            grep "^ADMIN_EMAILS=" /etc/amux/gateway.env | grep -q "qa-godmode@amux.io" || sed -i "s/^ADMIN_EMAILS=/ADMIN_EMAILS=qa-godmode@amux.io,/" /etc/amux/gateway.env
            echo "admin emails now: $(grep ^ADMIN_EMAILS= /etc/amux/gateway.env)"'

      - name: Sync gateway secrets from repo secrets (host-only, never in a container)
        run: |
          # Secrets live in GitHub (encrypted) and land in /etc/amux/gateway.env on
          # the HOST. The gateway process reads them; user containers never receive
          # them. Values are piped over stdin so they never appear in a command line
          # or in the workflow log.
          sync_secret() {
            NAME="$1"; VAL="$2"
            [ -z "$VAL" ] && { echo "$NAME: not set in repo secrets — skipped"; return; }
            printf '%s' "$VAL" | ssh -i ~/.ssh/amux_cloud root@34.121.177.76 \
              "read -r V; N='$NAME'; touch /etc/amux/gateway.env; chmod 600 /etc/amux/gateway.env;
               if grep -q \"^\$N=\" /etc/amux/gateway.env; then
                 grep -v \"^\$N=\" /etc/amux/gateway.env > /etc/amux/.ge.tmp
                 mv /etc/amux/.ge.tmp /etc/amux/gateway.env
                 chmod 600 /etc/amux/gateway.env
               fi
               printf '%s=%s\n' \"\$N\" \"\$V\" >> /etc/amux/gateway.env
               echo \"\$N updated (\${#V} chars, value not shown)\""
          }
          sync_secret STRIPE_SECRET_KEY "${{ secrets.STRIPE_SECRET_KEY }}"
          sync_secret ANTHROPIC_API_KEY "${{ secrets.ANTHROPIC_API_KEY }}"
          sync_secret STRIPE_PLATFORM_FEE_PRICE_ID "${{ secrets.STRIPE_PLATFORM_FEE_PRICE_ID }}"
          sync_secret STRIPE_PLATFORM_PRICE_ID "${{ secrets.STRIPE_PLATFORM_PRICE_ID }}"

      - name: Deploy scripts/watchdog.py (bind-mounted by every watchdog sidecar)
        run: |
          # This file was NEVER shipped. The compose template bind-mounts
          # /opt/amux-cloud/app/scripts/watchdog.py into every watchdog sidecar,
          # and docker CREATES A DIRECTORY when a bind-mount source does not
          # exist. Python was handed a directory, said "can't find '__main__'
          # module", exited 1 — and `restart: unless-stopped` restarted it
          # instantly, forever. restartCount reached 4318, the churn saturated
          # dockerd, `docker ps` began timing out, sshd starved, and the host
          # went dark for an hour (AC-162/AC-163). One missing rsync line.
          # The path is currently a DIRECTORY (docker's bind-mount artifact), and
          # rsyncing a file onto a directory path puts the file INSIDE it —
          # .../watchdog.py/watchdog.py — which is still not a module. Clear the
          # directory first. Scoped to exactly this path and only when it IS a
          # directory, so this can never remove a real file.
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 '
            p=/opt/amux-cloud/app/scripts/watchdog.py
            if [ -d "$p" ]; then echo "clearing stale DIRECTORY at $p (docker bind-mount artifact)"; rm -rf "$p"; fi
            mkdir -p /opt/amux-cloud/app/scripts'
          rsync --inplace -e "ssh -i ~/.ssh/amux_cloud" scripts/watchdog.py \
            root@34.121.177.76:/opt/amux-cloud/app/scripts/watchdog.py
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 \
            'test -f /opt/amux-cloud/app/scripts/watchdog.py \
               && echo "watchdog.py present as a FILE ($(wc -c < /opt/amux-cloud/app/scripts/watchdog.py) bytes)" \
               || { echo "STILL NOT A FILE — sidecars will keep crashlooping"; exit 1; }'

      - name: Deploy gateway.py
        run: |
          rsync --inplace -e "ssh -i ~/.ssh/amux_cloud" cloud/gateway/gateway.py \
            root@34.121.177.76:/opt/amux-cloud/gateway/gateway.py
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 \
            'pip3 install -q stripe 2>/dev/null; systemctl restart amux-gateway && echo "gateway restarted"'

      - name: Deploy docker-compose template
        run: |
          rsync -e "ssh -i ~/.ssh/amux_cloud" cloud/docker/docker-compose.template.yml \
            root@34.121.177.76:/opt/amux-cloud/docker/docker-compose.template.yml

      - name: Regenerate per-user compose files and apply changes
        run: |
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 'bash -s' << 'ENDSSH'
            source /etc/amux/gateway.env
            R2_ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
            TEMPLATE=/opt/amux-cloud/docker/docker-compose.template.yml
            # This step has produced ZERO output on every recent run — no compose
            # output, none of the per-workspace lines added below it — and
            # finished in 1.4s while reporting success. Two fixes have now been
            # shipped INTO a loop that may never iterate. Before any more logic
            # goes in here, say out loud what the glob actually matched: an empty
            # glob leaves `user_dir` as the literal pattern, the body runs once,
            # `port` comes back empty and `continue` skips it silently, which is
            # indistinguishable from "there were no workspaces".
            echo "== deploy loop preflight =="
            echo "  template exists: $([ -f "$TEMPLATE" ] && echo yes || echo NO)"
            _n=$(ls -d /var/amux/users/*/ 2>/dev/null | wc -l | tr -d ' ')
            echo "  /var/amux/users/*/ matched: ${_n} dir(s)"
            if [ "${_n}" = "0" ]; then
              echo "  LOOP WILL DO NOTHING — what actually exists under /var/amux:"
              ls -la /var/amux/ 2>&1 | head -10 | sed 's/^/    /'
              echo "  and where compose files really are:"
              find / -name docker-compose.yml -path '*amux*' -not -path '*/node_modules/*' 2>/dev/null | head -5 | sed 's/^/    /'
            else
              ls -d /var/amux/users/*/ 2>/dev/null | head -3 | sed 's/^/    /'
            fi
            for user_dir in /var/amux/users/*/; do
              user_id=$(basename "$user_dir")
              compose_file="$user_dir/docker-compose.yml"
              # Search the WHOLE file for the host port bound to :8822. This used
              # to be `grep -A1 "ports:"`, which assumed the mapping sits on the
              # very next line — until the loopback-only security fix put a
              # four-line comment there. From that commit onward the parse read
              # the comment, found no port, and every workspace hit the silent
              # `continue` below: 19 of 19 skipped, compose never regenerated,
              # `docker compose up -d` never run, and the step still exited 0.
              # A security fix disabled the deploy loop and nothing said so.
              port=$(grep -oP "[0-9]{4,}(?=:8822)" "$compose_file" 2>/dev/null | head -1)
              if [ -z "$port" ]; then
                # Was a silent `continue`. The glob matches 19 workspaces and the
                # step still produced no output in 0.2s, which means every one of
                # them landed here and said nothing — so the compose regeneration
                # and `docker compose up -d` have not run for ANY workspace, for
                # as long as this has been true. Containers still restart on
                # deploy, but from the step-4 shared-mount touch, not from here.
                echo "  SKIP ${user_id}: no port parsed from ${compose_file}"
                if [ -z "${_diag_done:-}" ]; then
                  _diag_done=1
                  echo "    compose file exists: $([ -f "$compose_file" ] && echo yes || echo NO)"
                  echo "    grep -P supported:   $(echo x8822 | grep -qoP '8822' 2>/dev/null && echo yes || echo NO)"
                  echo "    ports: line(s) seen:"
                  grep -A1 "ports:" "$compose_file" 2>&1 | head -4 | sed 's/^/      /'
                fi
                continue
              fi
              sed "s/\${USER_ID}/${user_id}/g;
                   s/\${USER_PORT}/${port}/g;
                   s/\${CF_ACCOUNT_ID}/${CF_ACCOUNT_ID}/g;
                   s|\${R2_ENDPOINT}|${R2_ENDPOINT}|g;
                   s/\${R2_ACCESS_KEY}/${R2_ACCESS_KEY}/g;
                   s/\${R2_SECRET_KEY}/${R2_SECRET_KEY}/g" \
                "$TEMPLATE" > "$compose_file"
              cd "$user_dir" && docker compose up -d --no-recreate 2>&1 | grep -v "^#" | tail -3
              # Session autostart has to arrive through server.env, NOT the image.
              # These containers are never recreated: --no-recreate is the whole
              # point here, so a container created 2026-07-30 is still serving
              # today's amux-server.py, and an ENV added to the Dockerfile or to
              # the compose template reaches it only if it is rebuilt — which it
              # is not. server.env lives on the volume and is read at server
              # start, so it survives exactly the restart this loop performs.
              # Without it a deploy stops every session in the workspace and
              # nothing brings them back (AC-153).
              # Write through the VOLUME, not `docker exec`. exec needs the
              # container up, and this runs moments after `compose up -d` while
              # it may still be restarting — the first version used exec with
              # 2>/dev/null and `|| true`, so it failed on every workspace and
              # said nothing, and two deploys later the env was still absent
              # with the loop reporting success. A step that cannot report its
              # own failure is the bug this whole file exists to avoid.
              if docker run --rm -v "amux-data-${user_id}:/root/.amux" alpine:latest sh -c \
                   'touch /root/.amux/server.env;
                    grep -q "^AMUX_AUTOSTART_SESSIONS=" /root/.amux/server.env \
                      || echo AMUX_AUTOSTART_SESSIONS=1 >> /root/.amux/server.env;
                    grep -q "^AMUX_AUTOSTART_SESSIONS=1$" /root/.amux/server.env'; then
                echo "  autostart env: OK for ${user_id}"
              else
                echo "  autostart env: FAILED for ${user_id} — sessions will not"
                echo "                 come back after this container is replaced"
              fi
            done
          ENDSSH
