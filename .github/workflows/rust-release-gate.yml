name: rust-release-gate
# RR-0117a — CI tiered pipeline: RELEASE GATE.
#
# What must be green to ship. Every job here BLOCKS the release; there is no
# `continue-on-error` in this file on purpose, because a release gate with a
# soft stage is a release gate that has already been bypassed once.
#
# The board's own vocabulary applies: passing this gate justifies `done`, not
# `verified`. `verified` needs the change exercised in production, which is the
# `prod-smoke` job below — and when that job cannot run, this workflow says so
# in the release output instead of quietly omitting it.

on:
  workflow_dispatch:
    inputs:
      allow_no_prod_smoke:
        description: 'Proceed WITHOUT a production smoke test (records that this release was not verified in prod)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- everything the PR Full Gate checks, re-run on the release commit -----
  full-gate:
    name: full gate (check, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace

  # --- the release artifact actually builds and runs ------------------------
  release-build:
    name: release build + boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p amux-server -p amux-cli
      - name: Boot and answer /health
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          AMUX_HOME=$WORK AMUX_DB=$WORK/amux.db AMUX_RS_PORT=18966 ./target/release/amux-server >$WORK/s.log 2>&1 &
          PID=$!
          for _ in $(seq 1 60); do curl -sk --max-time 2 https://localhost:18966/health >/dev/null 2>&1 && break; sleep 0.5; done
          HEALTH=$(curl -sk --max-time 5 https://localhost:18966/health)
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("build"), "health must report a build hash"; print("build", d["build"])'
          kill $PID
      - name: CLI answers its own version and help
        # A CLI whose new verb falls through to the help text and exits 0 is
        # the AMUX-2140 failure exactly: following the sanctioned instruction
        # produces a success signal and no action. So the gate asserts each
        # verb is REAL, not that the binary runs.
        run: |
          set -euo pipefail
          ./target/release/amux-rs --version
          for verb in board workers send schedules health search why; do
            ./target/release/amux-rs help "$verb" >/dev/null 2>&1 \
              || ./target/release/amux-rs "$verb" --help >/dev/null 2>&1 \
              || { echo "FAIL: verb '$verb' has no help — it is not a real subcommand"; exit 1; }
          done
          echo "all verbs present"

  # --- migration dry run ----------------------------------------------------
  migration-dry-run:
    name: migration dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p amux-server
      - name: Migrations are additive and idempotent over a populated DB
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          BIN=./target/release/amux-server
          boot() { AMUX_HOME=$WORK AMUX_DB=$WORK/amux.db AMUX_RS_PORT=18967 $BIN >>$WORK/s.log 2>&1 & echo $!; }
          PID=$(boot); for _ in $(seq 1 60); do curl -sk --max-time 2 https://localhost:18967/health >/dev/null 2>&1 && break; sleep 0.5; done; kill $PID || true; sleep 1
          sqlite3 $WORK/amux.db "INSERT INTO issues (id,title,desc,status,creator,created,updated) VALUES ('REL-1','t','d','todo','x',1,1);"
          sqlite3 $WORK/amux.db "SELECT name||'|'||type FROM sqlite_master ORDER BY 1;" > $WORK/before.txt
          PID=$(boot); for _ in $(seq 1 60); do curl -sk --max-time 2 https://localhost:18967/health >/dev/null 2>&1 && break; sleep 0.5; done; kill $PID || true; sleep 1
          sqlite3 $WORK/amux.db "SELECT name||'|'||type FROM sqlite_master ORDER BY 1;" > $WORK/after.txt
          diff $WORK/before.txt $WORK/after.txt || { echo "FAIL: schema objects changed on re-open"; exit 1; }
          [ "$(sqlite3 $WORK/amux.db 'SELECT COUNT(*) FROM issues;')" = "1" ] || { echo "FAIL: row lost"; exit 1; }
          echo "migration dry run OK"

  # --- offline ---------------------------------------------------------------
  offline:
    name: offline operation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Vendor dependencies, then build with the network cut
        # "Works offline" is a claim about the SHIPPED thing, so it is tested
        # by removing the network rather than by reading the dependency list.
        run: |
          set -euo pipefail
          cargo fetch --locked
          CARGO_NET_OFFLINE=true cargo build --release -p amux-server -p amux-cli
      - name: Search answers with no network (FTS5 is local by construction)
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          AMUX_HOME=$WORK AMUX_DB=$WORK/amux.db AMUX_RS_PORT=18968 ./target/release/amux-server >$WORK/s.log 2>&1 &
          PID=$!
          for _ in $(seq 1 60); do curl -sk --max-time 2 https://localhost:18968/health >/dev/null 2>&1 && break; sleep 0.5; done
          TOKEN=$(cat $WORK/auth-token 2>/dev/null || echo "")
          sqlite3 $WORK/amux.db "INSERT INTO issues (id,title,desc,status,creator,created,updated) VALUES ('OFF-1','offline capybara','x','todo','x',1,1);"
          OUT=$(curl -sk -H "Authorization: Bearer $TOKEN" "https://localhost:18968/api/search?q=capybara")
          echo "$OUT"
          echo "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"]==1, d; print("offline search OK")'
          kill $PID

  # --- UI coverage -----------------------------------------------------------
  ui:
    name: UI golden scenarios (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts 2>/dev/null || npm install
      # chromium AND webkit: the step below runs every project, and ios-safari
      # is a webkit project. A missing browser hard-errors (see rust.yml).
      - run: npx playwright install --with-deps chromium webkit
      - name: SPA static gate
        run: bash scripts/spa-lint.sh
      - run: cargo build -p amux-server
      - name: Golden scenarios
        run: npx playwright test --config e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: release-ui, path: test-results/, retention-days: 14 }

  # --- production smoke ------------------------------------------------------
  prod-smoke:
    name: production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [full-gate, release-build, migration-dry-run, offline, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke the production origin
        # This is the difference between `done` and `verified`. When
        # PROD_SMOKE_URL is not configured the job does NOT quietly pass: it
        # fails unless the operator explicitly ticked allow_no_prod_smoke,
        # and either way the release output records which happened.
        env:
          PROD_SMOKE_URL: ${{ vars.PROD_SMOKE_URL }}
          ALLOW: ${{ github.event.inputs.allow_no_prod_smoke }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_SMOKE_URL:-}" ]; then
            echo "NO PRODUCTION SMOKE: repository variable PROD_SMOKE_URL is not set."
            if [ "${ALLOW:-false}" = "true" ]; then
              echo "Operator ticked allow_no_prod_smoke. THIS RELEASE IS NOT VERIFIED IN PRODUCTION."
              exit 0
            fi
            echo "Set PROD_SMOKE_URL, or re-dispatch with allow_no_prod_smoke=true to ship an unverified release on purpose."
            exit 1
          fi
          echo "smoking $PROD_SMOKE_URL"
          H=$(curl -sSk --max-time 10 "$PROD_SMOKE_URL/health")
          echo "$H"
          echo "$H" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("build"), "no build hash in /health"; assert d.get("store") in (None,"ok"), d; print("prod /health ok, build", d["build"])'

  gate:
    name: RELEASE GATE
    runs-on: ubuntu-latest
    needs: [full-gate, release-build, migration-dry-run, offline, ui, prod-smoke]
    if: always()
    steps:
      - run: |
          echo "full-gate:        ${{ needs.full-gate.result }}"
          echo "release-build:    ${{ needs.release-build.result }}"
          echo "migration-dry-run:${{ needs.migration-dry-run.result }}"
          echo "offline:          ${{ needs.offline.result }}"
          echo "ui:               ${{ needs.ui.result }}"
          echo "prod-smoke:       ${{ needs.prod-smoke.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "RELEASE GATE: BLOCKED"; exit 1
          fi
          echo "RELEASE GATE: GREEN"
