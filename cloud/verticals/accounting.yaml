schedules:
- worker: ops-pulse
  title: 'Daily ops pulse: Lou Moran (5 offices)'
  expr: every weekday at 07:00
  enabled: false
  command: 'Read docs/pulse-entities-lou.md for office definitions and thresholds. For each office: check
    system status (VPN dashboards, ticketing system, backup monitoring). Note that Jerusalem (UTC+3) and
    Manila (UTC+8) run ahead -- their full day''s data is already available by 7am ET. Compile a single
    digest with per-office green/yellow/red status, red items first, in the format of docs/pulse-digest-sample.md.
    Send via the email API to lmoran@rothcocpa.com. If any office has a red-status metric (outage > 15
    min, backup missed 2 consecutive nights, > 20 unresolved tickets), flag it prominently at the top
    and open a board issue in the Office Health column.'
- worker: ops-pulse
  title: Weekly office health review
  expr: weekly on Monday at 08:00
  enabled: false
  command: 'Review the week''s daily digests and the Office Health board column. For each office: 1) ticket
    backlog trend (growing or shrinking?), 2) repeated yellow/red flags -- the same metric flagged 2+
    times in a week is systemic, not incidental (e.g. Jerusalem VPN latency, Manila backups), 3) backup
    completion rate, 4) VPN latency trend for Jerusalem and Manila. Write the review to docs/analytics/office-health-YYYY-WNN.md
    and email a summary to lmoran@rothcocpa.com. Recommend one concrete infrastructure fix per recurring
    flag.'
- worker: doc-chaser
  title: 'Document chaser: check outstanding items and send follow-ups'
  expr: daily at 08:00
  enabled: false
  command: 'Read all docs/doclist-*.md files. For each client with outstanding items: if days since last
    follow-up >= 3 and total follow-ups < 2, send a polite reminder. If follow-ups >= 2 and < 4, send
    a firmer follow-up. If follow-ups >= 4, escalate to the assigned partner via board issue + email.
    Update the doc file with the new follow-up count and date. Mark board issues done when all docs received.'
- worker: doc-chaser
  title: Weekly deadline risk review
  expr: weekly on Friday at 16:00
  enabled: false
  command: 'Review every docs/doclist-*.md against its filing deadline (entities Mar 15, individuals Apr
    15, extensions Oct 15). For each client: compute days remaining, documents outstanding, and response
    rate so far. Rank clients by filing risk. Any client that cannot realistically be filed on time gets
    a board issue recommending an extension, with the downstream impact named (e.g. CLI-004''s 12 blocked
    K-1s block 12 partners'' personal returns). Write the ranking to docs/analytics/deadline-risk-YYYY-WNN.md.'
- worker: billing-pilot
  title: 'Monthly billing cycle: generate and send invoices'
  expr: monthly on 1 at 09:00
  enabled: false
  command: 'Read all docs/engagement-*.md files. For each active engagement: calculate the current month
    billing amount based on fee structure (monthly, quarterly, semi-annual -- e.g. ENG-003 bills $5,583
    monthly, ENG-002 bills $4,625 quarterly). Draft invoice summary emails. Check for any overdue unpaid
    invoices from prior months. Send invoices via the email API. Create board issues for any invoices
    unpaid past Net terms. Update engagement docs with billing history.'
- worker: billing-pilot
  title: 'Engagement letter follow-up: check for unsigned letters'
  expr: every weekday at 09:30
  enabled: false
  command: 'Check the board''s Engagements column for letters still awaiting signature. For letters sent
    more than 7 days ago without a signature, send a follow-up email (see the ENG-002 Berger pattern:
    offer a DocuSign version, offer the alternate signer -- Leah handles the business paperwork). For
    letters more than 21 days overdue, escalate to the assigned partner. Also check renewal dates: any
    engagement within 90 days of expiration without a renewal letter drafted gets a board issue.'
