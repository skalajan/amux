_comment: 'ACCOUNTING FIRM vertical template (from RothCo/Roth&Co). Save-and-redeploy: edit org name +
  firm specifics, POST to /api/env/apply. groups+workers apply now; files/schedules/columns are AMUX-2977
  phase-2 (accepted, not-yet-applied).'
groups:
- name: multi-office-ops
  department: IT / Operations
  goal: Daily health across all offices, no surprises before the CIO wakes
- name: tax-practice
  department: Tax
  goal: Every client's documents in before the filing deadline
- name: engagement-billing
  department: Finance
  goal: Every engagement letter signed, every renewal on time
workers:
- name: ops-pulse
  dir: /root/rothco
  provider: claude
  model: sonnet
  desc: Multi-Office Ops Pulse -- daily green/yellow/red digest across Roth&Co's 5 offices in 3 time zones
  groups:
  - multi-office-ops
- name: doc-chaser
  dir: /root/rothco
  provider: claude
  model: sonnet
  desc: Client Document Chaser -- per-client checklists, automated follow-up cadence, partner escalation
  groups:
  - tax-practice
- name: billing-pilot
  dir: /root/rothco
  provider: claude
  model: sonnet
  desc: Engagement & Billing Pilot -- letter lifecycle, signature tracking, renewals, monthly billing
  groups:
  - engagement-billing
columns:
- Documents
- Engagements
- Office Health
files:
- path: /root/rothco/docs/pulse-entities-lou.md
  content: '# Multi-Office Pulse -- Lou Moran, Roth&Co


    ## Office 1: Brooklyn, NY (HQ)

    - Staff: ~80

    - Metrics: VPN/system uptime, open IT tickets, printer/scanner status, phone system status

    - Systems: CCH Axcess, SharePoint, RingCentral


    ## Office 2: Lakewood, NJ (Primary)

    - Staff: ~100

    - Metrics: Same as Brooklyn + server room temperature, backup completion status

    - Systems: Same stack, dedicated file server


    ## Office 3: Chicago, IL

    - Staff: ~30

    - Metrics: VPN tunnel status, remote desktop availability, bandwidth utilization

    - Systems: Thin client setup, all cloud-based


    ## Office 4: Jerusalem, Israel

    - Staff: ~25

    - Metrics: International VPN latency, local system uptime, timezone-shifted support ticket queue

    - Time offset: UTC+3 (7 hours ahead of ET)


    ## Office 5: Manila, Philippines

    - Staff: ~30

    - Metrics: BPO workstation availability, overnight processing completion rates, data entry accuracy
    metrics

    - Time offset: UTC+8 (12-13 hours ahead of ET)


    ## Alert Thresholds

    - System outage: any office offline > 15 minutes -> immediate alert

    - Open tickets: any office > 20 unresolved tickets -> flag in digest

    - Backup failure: any office backup missed -> flag + escalate if 2 consecutive

    - International VPN latency: > 200ms sustained -> flag in digest

    '
